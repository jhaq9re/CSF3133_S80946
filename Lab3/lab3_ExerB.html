
<!DOCTYPE html>
<html>
<head>
    <title>e-Ticket Your Campus Cinema</title>
</head>

<body>

    <h1>e-Ticket Your Campus Cinema</h1>
    <h2>Book Your Ticket</h2>

    <p>Promotion: Tickets Below RM10 for Students & Staff!</p>

    <form onsubmit="bookTicket(event)">

        <label>Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label>E-mail:</label>
        <input type="email" id="email" required>
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" id="phone" required>
        <br><br>

        <label>Show Date:</label>
        <input type="date" id="date" required>
        <br><br>

        <label>Show Time:</label>
        <input type="time" id="time" required>
        <br><br>

        <label>Movie:</label>
        <select id="movie" required>
            <option value="">Select Movie</option>
            <option>Ocean Mystery</option>
            <option>Inside Out 2</option>
            <option>Moana 2</option>
            <option>Kung Fu Panda 4</option>
        </select>
        <br><br>

        <h3>Ticket Quantity</h3>

        <label>Adult (RM10):</label>
        <input type="number" id="adult" min="0" value="0">
        <br><br>

        <label>Child (RM5):</label>
        <input type="number" id="child" min="0" value="0">
        <br><br>

        <label>Seat:</label>
        <select id="seat" required>
            <option value="">Select Seat</option>
            <option>Row A</option>
            <option>Row B</option>
            <option>Row C</option>
            <option>Row D</option>
        </select>
        <br><br>

        <label>Payment Method:</label>
        <select id="payment" required>
            <option value="">Select Payment</option>
            <option>Online Banking</option>
            <option>Debit Card</option>
            <option>Cash</option>
            <option>TNG eWallet</option>
        </select>
        <br><br>

        <button type="button" onclick="calculateTotal()">
            Calculate Total
        </button>

        <h3 id="total">Total Payment: RM0.00</h3>

        <button type="submit">Book Now</button>

    </form>

    <h3 id="result"></h3>

    <p>© 2026 CineKampus. All rights reserved.</p>
    <p>e-Ticket® – Campus Cinema Below RM10 Every Tuesday</p>

    <script>

        function calculateTotal() {

            let adult = Number(document.getElementById("adult").value);
            let child = Number(document.getElementById("child").value);

            let total = (adult * 10) + (child * 5);

            document.getElementById("total").innerHTML =
                "Total Payment: RM" + total.toFixed(2);
        }

        function bookTicket(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let movie = document.getElementById("movie").value;
            let adult = Number(document.getElementById("adult").value);
            let child = Number(document.getElementById("child").value);

            if (adult + child == 0) {
                alert("Please select your ticket quantity!");
                return;
            }

            let total = (adult * 10) + (child * 5);

            document.getElementById("result").innerHTML =
                "Booking Successful!<br><br>" +
                "Name: " + name + "<br>" +
                "Movie: " + movie + "<br>" +
                "Adult: " + adult + "<br>" +
                "Child: " + child + "<br>" +
                "Total Payment: RM" + total.toFixed(2);

        }

    </script>

</body>
</html>
