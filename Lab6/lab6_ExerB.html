
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade Calculator</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main heading -->
    <h2>Student Grade Calculator</h2>

    <!-- Student grade form -->
    <form name="gradeForm" onsubmit="return checkMark(event)">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br><br>

        <label for="mark">Mark (0-100):</label>
        <input type="text" id="mark" name="mark">
        <br><br>

        <!-- Buttons -->
        <button type="submit">Check Grade</button>
        <button type="button" onclick="randomMark()">Random Mark</button>

    </form>

    <!-- Display grade result -->
    <p id="result"></p>

    <!-- Display checking date and time -->
    <p id="checkTime"></p>

    <!-- Button to display grade table -->
    <button type="button" onclick="showTable()">Show Grade Table</button>

    <!-- Grade table container -->
    <div id="tableContainer"></div>

    <!-- Link JavaScript file -->
    <script src="grade.js"></script>

</body>
</html>
